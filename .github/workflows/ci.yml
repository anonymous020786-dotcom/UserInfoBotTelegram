name: Sentinel CI - Quality, Security & Automated Matrix Tests

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. CODE QUALITY & STATIC LINTING
  # ============================================================================
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black isort

      - name: Run Flake8 Code Quality Scan
        run: |
          python -m flake8 core/ handlers/ ui/ tests/ scripts/ database.py config.py

      - name: Verify Formatting (Black Check)
        continue-on-error: true
        run: |
          python -m black --check core/ handlers/ ui/ tests/ scripts/ database.py config.py

      - name: Verify Import Ordering (Isort Check)
        continue-on-error: true
        run: |
          python -m isort --check-only core/ handlers/ ui/ tests/ scripts/ database.py config.py

  # ============================================================================
  # 2. SECURITY AUDIT & VULNERABILITY SCANNING
  # ============================================================================
  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Run Bandit AST Security Scan
        run: |
          python -m bandit -r core/ handlers/ database.py -ll

      - name: Audit Dependencies for Known CVEs (Pip-Audit)
        run: |
          python -m pip_audit -r requirements.txt

  # ============================================================================
  # 3. AUTOMATED MATRIX TESTING & COVERAGE
  # ============================================================================
  matrix-tests:
    name: Tests (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: [code-quality, security-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Headless CI Automated Test Suite
        run: |
          python -m pytest tests/test_ci.py -v --cov=core --cov=handlers --cov=database --cov-report=xml --cov-report=term

      - name: Run Container & Deployment Health Probe
        run: |
          python scripts/healthcheck.py

      - name: Upload Coverage Artifact (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 14

  # ============================================================================
  # 4. DOCKER BUILD VALIDATION
  # ============================================================================
  docker-validation:
    name: Docker Build Validation
    needs: [matrix-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sentinel-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
