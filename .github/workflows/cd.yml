name: Sentinel CD - Container Build, GHCR Publish & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 1. BUILD & PUBLISH MULTI-ARCH DOCKER IMAGE TO GHCR
  # ============================================================================
  build-and-publish:
    name: Build & Publish Container (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU (Multi-Architecture Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. CONTINUOUS DEPLOYMENT TRIGGER & ROLLOUT
  # ============================================================================
  deploy:
    name: Deploy to Production
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://t.me/userinfo20262_bot
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Trigger Webhook / Coolify / Portainer / VPS Rollout
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering deployment webhook..."
          curl -X POST -s -f "$DEPLOY_WEBHOOK_URL" || echo "Webhook trigger warning, continuing verification."

      - name: Verify Live Deployment Health
        run: |
          echo "Deployment initiated. Sentinel bot container image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Active live bot handle: @userinfo20262_bot"

  # ============================================================================
  # 3. AUTOMATED SEMANTIC GITHUB RELEASE (TAGGED BUILDS)
  # ============================================================================
  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog & Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Sentinel Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            data/curated_catalog.json
            docker-compose.yml
